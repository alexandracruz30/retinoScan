{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/upload_image.css' %}">
{% endblock %}

{% block content %}
<div class="upload-container">
    <h1>Diagnóstico de Retinopatía Diabética</h1>
    <p class="patient-info">Paciente: {{ patient.nombre }} {{ patient.apellido }}</p>

    <div class="upload-form">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="image-upload-section">
                <label>Imagen de Retina:</label>
                <input type="file" name="imagen" accept="image/*" required>
                <input type="text" name="nombre_escaneo" placeholder="Nombre del escaneo (ej: Escaneo rutina 2025)" required>
            </div>
            <button type="submit" class="btn-analyze">Analizar con IA</button>
        </form>
    </div>

    <div class="back-link">
        <a href="{% url 'patient_detail' patient.id %}">← Volver al historial del paciente</a>
    </div>
</div>
{% endblock %}
