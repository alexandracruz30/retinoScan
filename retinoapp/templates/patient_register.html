{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/patient_register.css' %}">
{% endblock %}

{% block content %}
<div class="register-background">
    <div class="register-container">
        <h1 class="register-title">Registrar Nuevo Paciente</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Sección Datos Personales -->
            <div class="form-section">
                <h2 class="section-title">Datos Personales</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <div class="input-with-icon">
                            <i class="icon-user">👤</i>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <div class="input-with-icon">
                            <i class="icon-id">📋</i>
                            <input type="text" id="cedula" name="cedula" placeholder="Cédula" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </div>
                </div>
            </div>

            <!-- Sección Datos Médicos -->
            <div class="form-section">
                <h2 class="section-title">Datos Médicos Iniciales</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="grupo_sanguineo">Grupo Sanguíneo</label>
                        <div class="input-with-icon">
                            <i class="icon-blood">💉</i>
                            <select id="grupo_sanguineo" name="grupo_sanguineo" required>
                                <option value="">Seleccionar</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="alergias">Historial de Alergias</label>
                        <input type="text" id="alergias" name="alergias" placeholder="Alergias">
                    </div>

                    <div class="form-group full-width">
                        <label for="enfermedades">Enfermedades Crónicas</label>
                        <div class="input-with-icon">
                            <i class="icon-health">🏥</i>
                            <input type="text" id="enfermedades" name="enfermedades" placeholder="Enfermedades crónicas">
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar y Continuar</button>
        </form>

        <!-- Foto del Paciente -->
        <div class="photo-upload">
            <label for="foto" class="photo-label">
                <div class="photo-circle">
                    <span class="plus-icon">+</span>
                </div>
                <span>Foto del Paciente</span>
            </label>
            <input type="file" id="foto" name="foto" accept="image/*" hidden>
        </div>
    </div>
</div>
{% endblock %}
